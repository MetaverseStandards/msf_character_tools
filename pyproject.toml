[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.4"]
build-backend = "build_backend"
backend-path = ["tools"]

[project]
name = "msf-tools"
version = "0.3.0"
description = "Validated signal mappings and immutable glTF reference evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND BSD-3-Clause AND BSL-1.0 AND PSF-2.0"
license-files = ["LICENSE", "NOTICE.md", "LICENSES/MIT.txt", "LICENSES/BSD-3-Clause.txt", "LICENSES/robin_map-MIT.txt",
                 "LICENSES/BSL-1.0.txt", "LICENSES/PSF-2.0.txt", "core/third_party/fast_float/LICENSE-MIT"]
authors = [{name = "MSF Tools contributors"}]
dependencies = []

[project.optional-dependencies]
usd = ["usd-core>=25.11,<27"]
fbx = ["msf-tools-ufbx>=0.1.6,<0.2"]

[project.scripts]
msf-tools = "msf_tools.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
# CMakeLists.txt installs the package: msf_tools/*.py, the extension and the build record.
wheel.packages = []
sdist.include = ["msf_tools/_build_info.json"]
sdist.exclude = ["build", "native", "tests", "examples", "scripts"]
