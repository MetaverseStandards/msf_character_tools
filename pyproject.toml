[build-system]
# Exact pins keep release wheels reproducible; NOTICE.md names the nanobind version linked in.
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0"]
build-backend = "build_backend"
backend-path = ["tools"]

[project]
name = "msf-tools"
version = "0.4.0"
description = "Validated signal mappings and immutable glTF reference evaluation"
readme = "README.md"
requires-python = ">=3.11"
# Code: MIT, plus BSD-3-Clause, BSL-1.0, PSF-2.0 and MIT in the extension. Documentation, schemas and the README
# (the long description) are CC-BY-SA-4.0; see NOTICE.md.
license = "MIT AND BSD-3-Clause AND BSL-1.0 AND PSF-2.0 AND CC-BY-SA-4.0"
license-files = ["LICENSE", "NOTICE.md", "LICENSES/MIT.txt", "LICENSES/CC-BY-SA-4.0.txt", "LICENSES/BSD-3-Clause.txt", "LICENSES/robin_map-MIT.txt",
                 "LICENSES/BSL-1.0.txt", "LICENSES/PSF-2.0.txt", "LICENSES/ufbx-MIT.txt", "core/third_party/fast_float/LICENSE-MIT"]
authors = [{name = "MSF Tools contributors"}]
dependencies = []

[project.optional-dependencies]
usd = ["usd-core>=25.11,<27"]
# FBX support is compiled in; the empty extra keeps `msf-tools[fbx]` installs working.
fbx = []

[project.scripts]
msf-tools = "msf_tools.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.build-type = "Release"
# CMakeLists.txt installs the package: msf_tools/*.py, the extension and the build record.
wheel.packages = []
# One abi3 wheel for CPython 3.12 and later (nanobind's minimum for the stable ABI); 3.11 gets its own cp311 wheel.
wheel.py-api = "cp312"
sdist.include = ["msf_tools/_build_info.json"]
sdist.exclude = ["build", "native", "tests", "examples", "scripts"]
