[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "msf-tools"
version = "0.3.0"
description = "Validated signal mappings and immutable glTF reference evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "MSF Tools contributors"}]
dependencies = []

[project.optional-dependencies]
usd = ["usd-core>=25.11,<27"]
fbx = ["msf-tools-ufbx>=0.1.6,<0.2"]

[project.scripts]
msf-tools = "msf_tools.cli:main"

[tool.setuptools]
packages = ["msf_tools", "msf_tools.sources"]
