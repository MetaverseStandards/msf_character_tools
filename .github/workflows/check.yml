name: Reference and native checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Pushes run Linux only; pull requests and manual runs add macOS and Windows.
jobs:
  python:
    strategy:
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests
      - run: python -B check.py
  native:
    strategy:
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DMSF_BUILD_NATIVE_PILOT=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
