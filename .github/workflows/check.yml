# Dormant: GitHub Actions is not turned on for this repository, so this workflow does not run.
# scripts/ci_local.sh is the CI run until it is turned on; keep the two in step.
name: Reference checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Pushes run Linux only; pull requests and manual runs add macOS.
jobs:
  python:
    strategy:
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The build pins from pyproject.toml; CMake finds nanobind through this interpreter.
      - run: python -m pip install nanobind==3.1.0 scikit-build-core==1.1.1 'cmake>=3.26' ninja
      - run: cmake -S . -B build/core -G Ninja -DPython_EXECUTABLE="$(which python)" -DMSF_CORE_IN_PLACE=ON && cmake --build build/core
      - run: python -B -m unittest discover -s tests/public
        env: {MSF_REQUIRE_FORMATS: fbx, PYTHONHASHSEED: '0'}
      - run: python -B -m unittest discover -s tests/internal -t tests
        env: {MSF_REQUIRE_FORMATS: fbx, PYTHONHASHSEED: '0'}
      - run: python -B -m unittest discover -s tests/public
        env: {MSF_TOOLS_PURE: '1'}
      - run: python -B check.py
