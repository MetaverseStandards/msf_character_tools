# Dormant: GitHub Actions is blocked by account billing, so this workflow does not run.
# scripts/ci_local.sh is the CI run until it is re-enabled; keep the two in step.
name: Reference checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Pushes run Linux only; pull requests and manual runs add macOS.
jobs:
  python:
    strategy:
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests
      - run: python -B check.py
