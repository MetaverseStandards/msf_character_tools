# SPDX-License-Identifier: MIT
# Every diagnostic code msf-tools reports, one table per code.
#
# severity  error (E_), warning (W_) or info (I_).
# strict    for warnings a source adapter declares as losses: the error that
#           replaces the warning when inspect_asset runs with losses = "strict".
# since     the first release that reports the code. Codes added after
#           0.2.0.dev0 name the next planned release, 0.3.0.
# reserved  registered before any code path reports it.
# removed   the release that stopped reporting it.
# meaning   one line; diagnostic messages carry the specifics.
#
# tests/test_diagnostics_registry.py checks this file against the source.

[E_ACCESSOR_ALIGNMENT]
